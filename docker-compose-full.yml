services:
  postgres:
    image: postgres:16-alpine
    container_name: quadra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quadra
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quadra"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quadra-network

  api:
    container_name: quadra-api
    build:
      context: ../quadra-api
      dockerfile: Dockerfile.local
    volumes:
      - ../quadra-api:/home/node/app
      - /home/node/app/node_modules
    env_file:
      - ../quadra-api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@quadra-postgres:5432/quadra?schema=public
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quadra-network

  web:
    container_name: quadra-web
    build:
      context: ../quadra-web
      dockerfile: Dockerfile.local
    volumes:
      - ../quadra-web:/home/node/app
      - /home/node/app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - quadra-network

networks:
  quadra-network:
    name: quadra-network
    driver: bridge
