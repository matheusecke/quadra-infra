services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcc
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tcc-network

  api:
    container_name: tcc-api
    build:
      context: ../tcc-api
      dockerfile: Dockerfile.local
    volumes:
      - ../tcc-api:/home/node/app
      - /home/node/app/node_modules
    env_file:
      - ../tcc-api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@tcc-postgres:5432/tcc?schema=public
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tcc-network

  web:
    container_name: tcc-web
    build:
      context: ../tcc-web
      dockerfile: Dockerfile.local
    volumes:
      - ../tcc-web:/home/node/app
      - /home/node/app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - tcc-network

networks:
  tcc-network:
    name: tcc-network
    driver: bridge
