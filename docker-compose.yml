services:
  postgres:
    image: postgres:16-alpine
    container_name: quadra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quadra
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quadra"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quadra-network

networks:
  quadra-network:
    name: quadra-network
    driver: bridge
