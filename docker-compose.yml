services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcc
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tcc-network

networks:
  tcc-network:
    name: tcc-network
    driver: bridge
